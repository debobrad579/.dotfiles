[colors]
background = #282C34
background-alt = #21252B
foreground = #ABB2BF
primary = #E5C07B
secondary = #61AFEF
danger = #E06C75
disabled = #5C6370

[bar/main]
width = 100%
height = 24pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

padding-left = 0
padding-right = 1
module-margin = 1

font-0 = monospace:size=11
font-1 = "JetBrainsMono Nerd Font Mono:size=16;2"

modules-left = xworkspaces
modules-center = spotify
modules-right = bluetooth ethernet wifi brightness battery volume date power

cursor-click = pointer

enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces

label-active = %icon%
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.primary}
label-active-padding = 1

label-occupied = %icon%
label-occupied-padding = 1

label-urgent = %icon%
label-urgent-background = ${colors.danger}
label-urgent-padding = 1

label-empty = %icon%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

icon-0 = 1;
icon-1 = 2;
icon-2 = 3;
icon-3 = 4;4
icon-4 = 5;5
icon-5 = 6;6
icon-6 = 7;7
icon-7 = 8;8
icon-8 = 9;9
icon-9 = 10;10

[module/brightness]
type = internal/backlight

format = <ramp> <label>
label = "%percentage%%"

ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃝
ramp-3 = 󰃠

[module/volume]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

format-muted = <label-muted>
label-muted = 󰸈 (%percentage%%)
label-muted-foreground = ${colors.disabled}

[module/wifi]
type = internal/network
interface-type = wireless
interval = 5

format-connected = <ramp-signal> <label-connected>
label-connected = %essid%

ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤟
ramp-signal-3 = 󰤢
ramp-signal-4 = 󰤢
ramp-signal-5 = 󰤢
ramp-signal-6 = 󰤥
ramp-signal-7 = 󰤥
ramp-signal-8 = 󰤥
ramp-signal-9 = 󰤥
ramp-signal-10 = 󰤨

format-disconnected =

[module/ethernet]
type = internal/network
interface-type = wired
interval = 5

format-connected = <label-connected>
label-connected = 󰈁 %ifname%

format-disconnected =
label-disconnected = 󰈂
label-disconnected-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD

format-charging = 󰂄 <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = 󰁹 <label-full>
format-low = <animation-low> <label-low>
format-low-foreground = ${colors.danger}

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 100%
label-low = %percentage%%

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂

animation-low-0 = 󰂃
animation-low-1 = 󰂎
animation-low-framerate = 250

[module/bluetooth]
type = custom/script

exec = polybar-bluetooth
tail = true

[module/spotify]
type = custom/script

exec = polybar-spotify
tail = true

click-left = playerctl -p spotify play-pause
scroll-up = playerctl -p spotify volume 0.05+
scroll-down = playerctl -p spotify volume 0.05-

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%

[module/power]
type = custom/text

content = 
content-foreground = ${colors.primary}

click-left = powermenu

[settings]
screenchange-reload = true
