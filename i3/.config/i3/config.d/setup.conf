font pango:Sans 12

exec --no-startup-id xrandr --output HDMI-1-1 --mode 1920x1080 --rate 60 --primary

exec --no-startup-id xinput set-prop "ELAN0504:01 04F3:3091 Touchpad" "libinput Natural Scrolling Enabled" 1

exec --no-startup-id dex-autostart --autostart --environment i3
exec --no-startup-id picom
exec --no-startup-id unclutter -idle 1 -root

exec_always --no-startup-id launch-polybar

exec_always --no-startup-id feh --bg-fill ~/.config/i3/wallpaper.jpg

# Startup Workspaces Setup
assign [class="Alacritty"] workspace 1
assign [class="zen"] workspace 2
assign [class="Spotify"] workspace 3

exec alacritty
exec --no-startup-id sh -c 'sleep 1 && zen-browser'
exec --no-startup-id sh -c 'sleep 1 && spotify-launcher'
